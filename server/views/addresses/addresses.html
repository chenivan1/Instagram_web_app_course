<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Addresses Map</title>
    <link rel="stylesheet" href="/assets/addresses/addresses.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Sidebar -->
    <div class="col-lg-2 col-md-3 col-sm-4 sidebar-container">
        <img src="/assets/recources/instagram.png" class="instagram">
        <div class="sidebar_btns">
            <button class="sidebar_btn" type="button" onclick="window.location.href='/home'">
                <img src="/assets/recources/home.png" class="sidebar_icons"> Home
            </button>
            <button class="sidebar_btn" type="button" onclick="window.location.href='/posts-creation'">
                <img src="/assets/recources/create.png" class="sidebar_icons"> Create Post
            </button>
            <button class="sidebar_btn" type="button" onclick="window.location.href='/communities-management'">
                <img src="/assets/recources/explore.png" class="sidebar_icons"> Communities
            </button>
            <button class="sidebar_btn" type="button" onclick="window.location.href='/news'">
                <img src="/assets/recources/messages-removebg.png" class="sidebar_icons"> News
            </button>
            <button class="sidebar_btn active" type="button" onclick="window.location.href='/addresses'">
                <img src="/assets/recources/explore.png" class="sidebar_icons"> Addresses
            </button>
            <button class="sidebar_btn" type="button" onclick="window.location.href='/user/user-management'">
                <img src="/assets/recources/profile.png" class="sidebar_icons"> Manage Users
            </button>
            <button id="logout-btn" class="sidebar_btn" type="button">
                <img src="/assets/recources/logout.png" class="sidebar_icons"> Logout
            </button>
        </div>
    </div>
    <div class="addresses-container">
        <div class="container-fluid">
            <div class="header">
                <h1>Users Addresses Map</h1>
                <p>View all user addresses on an interactive map</p>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div id="map-container">
                        <div id="map"></div>
                        <div id="loading" class="loading">Loading map...</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div id="addresses-list">
                        <h3>Addresses List</h3>
                        <div id="addresses-container">
                            <div class="loading">Loading addresses...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/addresses/addresses.js"></script>
</body>

</html>
