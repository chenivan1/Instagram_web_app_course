<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communities - Instagram Web App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/communities/communities.css">
</head>

<body>
    <!-- Sidebar -->
    <div class="col-lg-2 col-md-3 col-sm-4 sidebar-container">
        <img src="/assets/recources/instagram.png" class="instagram">
        <div class="sidebar_btns">
            <button class="sidebar_btn" type="button" onclick="window.location.href='/home'">
                <img src="/assets/recources/home.png" class="sidebar_icons"> Home
            </button>
            <button class="sidebar_btn" type="button" onclick="window.location.href='/posts-creation'">
                <img src="/assets/recources/create.png" class="sidebar_icons"> Create Post
            </button>
            <button class="sidebar_btn active" type="button" onclick="window.location.href='/communities-management'">
                <img src="/assets/recources/explore.png" class="sidebar_icons"> Communities
            </button>
            <button class="sidebar_btn" type="button" onclick="window.location.href='/news'">
                <img src="/assets/recources/messages-removebg.png" class="sidebar_icons"> News
            </button>
            <button class="sidebar_btn" type="button" onclick="window.location.href='/addresses'">
                <img src="/assets/recources/explore.png" class="sidebar_icons"> Addresses
            </button>
            <button class="sidebar_btn" type="button" onclick="window.location.href='/user/user-management'" style="display: none;">
                <img src="/assets/recources/profile.png" class="sidebar_icons"> Manage Users
            </button>
            <button id="logout-btn" class="sidebar_btn" type="button">
                <img src="/assets/recources/logout.png" class="sidebar_icons"> Logout
            </button>
        </div>
    </div>
    <div class="container mt-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-md-8">
                <h1>Communities</h1>
                <p class="text-muted">Discover and manage communities</p>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createCommunityModal">
                    Create Community
                </button>
            </div>
        </div>

        <!-- Filter Tabs -->
        <ul class="nav nav-tabs mb-4" id="communityTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="all-communities-tab" data-bs-toggle="tab"
                    data-bs-target="#all-communities" type="button" role="tab">
                    All Communities
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="my-subscriptions-tab" data-bs-toggle="tab"
                    data-bs-target="#my-subscriptions" type="button" role="tab">
                    My Subscriptions
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="managed-communities-tab" data-bs-toggle="tab"
                    data-bs-target="#managed-communities" type="button" role="tab">
                    Communities I Manage
                </button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="communityTabsContent">
            <!-- All Communities Tab -->
            <div class="tab-pane fade show active" id="all-communities" role="tabpanel">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search communities...">
                    </div>
                </div>
                <div id="allCommunitiesList" class="row">
                    <!-- Communities will be loaded here -->
                </div>
            </div>

            <!-- My Subscriptions Tab -->
            <div class="tab-pane fade" id="my-subscriptions" role="tabpanel">
                <div id="subscribedCommunitiesList" class="row">
                    <!-- Subscribed communities will be loaded here -->
                </div>
            </div>

            <!-- Managed Communities Tab -->
            <div class="tab-pane fade" id="managed-communities" role="tabpanel">
                <div class="row mb-3">
                    <div class="col-md-12 text-end">
                        <button id="viewStatisticsBtn" class="btn btn-info" onclick="window.location.href='/communities/statistics/page'">
                            <i class="fas fa-chart-bar"></i> View Statistics
                        </button>
                    </div>
                </div>
                <div id="managedCommunitiesList" class="row">
                    <!-- Managed communities will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Create Community Modal -->
    <div class="modal fade" id="createCommunityModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Community</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createCommunityForm">
                        <div class="mb-3">
                            <label for="communityName" class="form-label">Community Name *</label>
                            <input type="text" class="form-control" id="communityName"
                                placeholder="Enter community name" maxlength="50" required>
                            <div class="form-text">3-50 characters, must be unique</div>
                            <div class="invalid-feedback" id="nameError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="communityDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="communityDescription" rows="3"
                                placeholder="Describe your community (optional)" maxlength="200"></textarea>
                            <div class="form-text">Maximum 200 characters</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="createCommunityBtn">Create Community</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Community Modal -->
    <div class="modal fade" id="editCommunityModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Community</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editCommunityForm">
                        <input type="hidden" id="editCommunityId">
                        <div class="mb-3">
                            <label for="editCommunityName" class="form-label">Community Name *</label>
                            <input type="text" class="form-control" id="editCommunityName"
                                placeholder="Enter community name" maxlength="50" required>
                            <div class="form-text">3-50 characters, must be unique</div>
                            <div class="invalid-feedback" id="editNameError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="editCommunityDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="editCommunityDescription" rows="3"
                                placeholder="Describe your community (optional)" maxlength="200"></textarea>
                            <div class="form-text">Maximum 200 characters</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="editCommunityBtn">Update Community</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Community Subscribers Modal -->
    <div class="modal fade" id="subscribersModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="subscribersModalTitle">Community Subscribers</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="subscribersList">
                        <!-- Subscribers will be loaded here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/communities/communities.js"></script>
</body>

</html>
