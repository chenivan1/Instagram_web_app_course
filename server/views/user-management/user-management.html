<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Instagram</title>
    <link rel="stylesheet" href="/assets/user-management/user-management.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
    <script defer src="/assets/user-management/user-management.js"></script>
</head>

<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-start flex-lg-row flex-column">
            <!-- Sidebar -->
            <div class="col-lg-2 col-md-3 col-sm-4 sidebar-container">
                <img src="/assets/recources/instagram.png" class="instagram">
                <div class="sidebar_btns">
                    <button class="sidebar_btn" type="button" onclick="window.location.href='/home'">
                        <img src="/assets/recources/home.png" class="sidebar_icons"> Home
                    </button>
                    <button class="sidebar_btn" type="button" onclick="window.location.href='/posts-creation'">
                        <img src="/assets/recources/create.png" class="sidebar_icons"> Create Post
                    </button>
                    <button class="sidebar_btn" type="button" onclick="window.location.href='/communities-management'">
                        <img src="/assets/recources/explore.png" class="sidebar_icons"> Communities
                    </button>
                    <button class="sidebar_btn" type="button" onclick="window.location.href='/news'">
                        <img src="/assets/recources/messages-removebg.png" class="sidebar_icons"> News
                    </button>
                    <button class="sidebar_btn" type="button" onclick="window.location.href='/addresses'">
                        <img src="/assets/recources/explore.png" class="sidebar_icons"> Addresses
                    </button>
                    <button class="sidebar_btn active" type="button">
                        <img src="/assets/recources/profile.png" class="sidebar_icons"> Manage Users
                    </button>
                    <button id="logout-btn" class="sidebar_btn" type="button">
                        <img src="/assets/recources/logout.png" class="sidebar_icons"> Logout
                    </button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-10 col-md-9 col-sm-8 main-content">
                <div class="management-container">
                    <h1 class="page-title">User Management</h1>
                    <p class="page-subtitle">Search and manage users in the system</p>

                    <!-- Search Section -->
                    <div class="search-section">
                        <div class="search-form">
                            <div class="row g-3">
                                <!-- Name Search -->
                                <div class="col-md-6">
                                    <label for="userSearch" class="form-label">User Name</label>
                                    <input type="text" id="userSearch" class="form-control"
                                        placeholder="Search by full name..." maxlength="100">
                                </div>

                                <!-- User Role Filter -->
                                <div class="col-md-6">
                                    <label for="userRoleFilter" class="form-label">User Role</label>
                                    <select class="form-select" id="userRoleFilter">
                                        <option value="">All Users</option>
                                        <option value="admin">Admin Users</option>
                                        <option value="regular">Regular Users</option>
                                    </select>
                                </div>

                                <!-- Registration Date Range -->
                                <div class="col-md-6">
                                    <label for="dateFromFilter" class="form-label">Registered From</label>
                                    <input type="date" class="form-control" id="dateFromFilter">
                                </div>

                                <div class="col-md-6">
                                    <label for="dateToFilter" class="form-label">Registered To</label>
                                    <input type="date" class="form-control" id="dateToFilter">
                                </div>
                            </div>

                            <!-- Search Buttons -->
                            <div class="search-buttons mt-3">
                                <button id="searchBtn" class="btn btn-primary">
                                    <img src="/assets/recources/search.png" alt="Search" class="btn-icon"> Search Users
                                </button>
                                <button id="clearBtn" class="btn btn-secondary">Clear Filters</button>
                            </div>
                        </div>
                    </div>

                    <!-- Results Section -->
                    <div class="results-section">
                        <div id="loadingSpinner" class="text-center" style="display: none;">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
                        <div id="successMessage" class="alert alert-success" style="display: none;"></div>

                        <div id="userCount" class="user-count" style="display: none;">
                            <strong>Users found: <span id="countNumber">0</span></strong>
                        </div>

                        <div id="usersContainer" class="users-container">
                            <!-- Users will be populated here -->
                        </div>

                        <div id="noResultsMessage" class="no-results" style="display: none;">
                            <img src="/assets/recources/search.png" alt="No results" class="no-results-icon">
                            <h4>No users found</h4>
                            <p>Try adjusting your search terms</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal fade" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this user?</p>
                    <div class="user-info-preview">
                        <strong>Name:</strong> <span id="deleteUserName"></span><br>
                        <strong>Email:</strong> <span id="deleteUserEmail"></span>
                    </div>
                    <div class="alert alert-warning mt-3">
                        <strong>Warning:</strong> This action cannot be undone!
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete User</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <!-- Note: No jQuery needed - using vanilla JavaScript with XMLHttpRequests -->
</body>

</html>
