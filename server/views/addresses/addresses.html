<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Addresses Map</title>
    <link rel="stylesheet" href="/assets/addresses/addresses.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="header">
            <h1>Users Addresses Map</h1>
            <p>View all user addresses on an interactive map</p>
        </div>
        
        <div class="row">
            <div class="col-md-8">
                <div id="map-container">
                    <div id="map"></div>
                    <div id="loading" class="loading">Loading map...</div>
                </div>
            </div>
            <div class="col-md-4">
                <div id="addresses-list">
                    <h3>Addresses List</h3>
                    <div id="addresses-container">
                        <div class="loading">Loading addresses...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/addresses/addresses.js"></script>
</body>
</html>
