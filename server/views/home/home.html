<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instagram</title>
    <link rel="stylesheet" href="assets/home/home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.2.9/purify.min.js"></script>
    <script defer src="assets/home/enhanced-home.js"></script>
</head>
<button id="scrollToTopBtn" title="Go to top">↑</button><!--the button to scroll to the top of the page-->

<body>

    <div class="container-fluid">
        <!-- 
         Explanation of Bootstrap utility classes used on the main layout wrapper:
            d-flex                 - Applies Flexbox layout to the container.
            justify-content-between - Distributes child elements horizontally with space between them.
            align-items-start      - Aligns child elements to the top (start) of the cross axis (vertical).
            flex-lg-row            - From large screens (≥992px) and up, layout children in a horizontal row.
            flex-column            - For small and medium screens, layout children vertically (stacked).
        -->
        <div class="d-flex justify-content-between align-items-start flex-lg-row flex-column">
            <!-- User Details Section - Top Right -->
            <div class="user-details-container d-none d-lg-block">
                <div class="user-profile-section">
                    <img id="userProfilePicture" src="assets/recources/user.jpg" alt="Profile Picture" class="user-profile-img">
                    <div class="user-info">
                        <span id="userFullName" class="user-full-name">Loading...</span>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-2 col-md-3 col-sm-4 sidebar-container">
                <img src="assets/recources/instagram.png" class="instagram">
                <div class="sidebar_btns">
                    <button class="sidebar_btn" type="button"><img src="assets/recources/home.png"
                            class="sidebar_icons"> Home</button>
                    <button class="sidebar_btn" type="button" onclick="window.location.href='/posts-creation'"><img
                            src="assets/recources/create.png" class="sidebar_icons"> Create</button>
                    <button class="sidebar_btn" type="button"
                        onclick="window.location.href='/communities-management'"><img src="assets/recources/more.png"
                            class="sidebar_icons"> Communities</button>
                    <button class="sidebar_btn" type="button" onclick="window.location.href='/news'"><img
                            src="assets/recources/messages-removebg.png" class="sidebar_icons"> News</button>
                    <button class="sidebar_btn" type="button" onclick="window.location.href='/addresses'"><img
                            src="assets/recources/explore.png" class="sidebar_icons"> Addresses</button>
                    <button id="manage-users-btn" class="sidebar_btn" type="button" style="display: none;"
                        onclick="window.location.href='/user/user-management'"><img src="assets/recources/profile.png"
                            class="sidebar_icons"> Manage Users</button>
                    <button id="logout-btn" class="sidebar_btn" type="button"><img src="assets/recources/logout.png"
                            class="sidebar_icons"> Logout</button>

                    <!-- Modal for creating a new post -->
                    <div id="createPostModal" class="search-modal">
                        <div class="search-modal-content">
                            <span class="search-close-btn" id="createPostCloseBtn">&times;</span>
                            <h5>Create new post</h5>
                            <form id="createPostForm">
                                <div class="mb-3">
                                    <label for="postCaption" class="form-label">post text:</label>
                                    <input type="text" id="postCaption" class="form-control" placeholder="What's new?"
                                        required maxlength="200">
                                </div>
                                <div class="mb-3">
                                    <label for="postImage" class="form-label">Img link (optional)</label>
                                    <input type="text" id="postImage" class="form-control"
                                        placeholder="assets/recources/puppy-post.jpg">
                                </div>
                                <button type="submit" class="btn btn-primary" id="publishPostBtn">Publish Post</button>
                            </form>
                        </div>
                    </div>

                </div>

            </div>
        </div>

        <div class="col-lg-6 col-md-6 col-sm-8 feed-container">
            <!-- Filter checkbox above feed -->
            <div class="mb-3 d-flex align-items-center gap-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="myPostsOnlyFilter">
                    <label class="form-check-label" for="myPostsOnlyFilter">
                        Show only my posts
                    </label>
                </div>
            </div>

            <!-- Posts Section -->
            <div class="posts mt-5" id="postsContainer">
                <!-- Posts will be loaded dynamically here -->
                <div class="loading-posts text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Loading your feed...</p>
                </div>
            </div>

            <!-- Empty State -->
            <div id="emptyFeedState" class="text-center py-5" style="display: none;">
                <h4 class="text-muted">No posts in your feed</h4>
                <p class="text-muted">Subscribe to communities to see posts here, or create your first post!</p>
                <div class="mt-3">
                    <a href="/communities-management" class="btn btn-outline-primary me-2">Browse Communities</a>
                    <a href="/posts-creation" class="btn btn-primary">Create Post</a>
                </div>
            </div>

            <!-- suggestion container -->
        </div>

    </div>

    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
