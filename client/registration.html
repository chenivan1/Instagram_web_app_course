<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram Login</title>
  <link rel="registrationStyle" href="registration.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="row justify-content-center w-100">
      <!-- Login Form Section -->
      <div class="col-md-6 col-lg-4">
        <div class="card p-4 shadow-sm text-center">
          <img src="IMG/instagram.png" class="img-fluid mb-3 logo" alt="Instagram Logo" />
          <form id="form_login">
            <p>Sign up to see photos and videos from your friends.</p>
            <a href="#" class="text-primary text-decoration-none d-block mb-2">Log in with Facebook</a>
            <div class="d-flex justify-content-center align-items-center my-3">
              <hr class="flex-grow-1 me-2" />
              <span class="text-muted">OR</span>
              <hr class="flex-grow-1 ms-2" />
            </div>
            <div class="mb-3">
              <input id="email" type="text" class="form-control" placeholder="Mobile Number or Email" required />
            </div>
            <div class="mb-3">
              <input id="password" type="password" class="form-control" placeholder="Password" required />
            </div>
            <div class="mb-3">
              <input id="full_name" type="text" class="form-control" placeholder="Full Name" required />
            </div>
            <div class="mb-3">
              <input id="username" type="text" class="form-control" placeholder="Username" required />
            </div>
            <div class="mb-3">
              <input id="address" type="text" class="form-control" placeholder="Address" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
          </form>
        </div>
        
        <!-- Sign Up Prompt -->
        <div class="card mt-3 text-center p-3">
          <p class="mb-0">have an account? <a href="#" class="text-primary text-decoration-none">Log in</a></p>
        </div>
      </div>
    </div>
  </div>
   <!-- Footer Links -->
    <div class="footer d-flex align-items-center justify-content-center">
        <p>About · Help · Press · API · Jobs · Privacy · Terms · Locations · Language · Meta Verified</p>
    </div>
    <div class="footer d-flex align-items-center justify-content-center">
        <p>© 2025 INSTAGRAM FROM META</p>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="registration.js"></script>
</body>
</html>
